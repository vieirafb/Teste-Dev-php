openapi: 3.0.3
info:
  title: Customers API
  version: 1.0.0
  description: API para gerenciamento de clientes.
paths:
  /api/v1/customers:
    get:
      summary: Listagem de clientes
      parameters:
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
          description: Número de itens por página
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: Página atual
        - name: cpf
          in: query
          required: false
          schema:
            type: string
          description: Filtra clientes pelo CPF
        - name: zipcode
          in: query
          required: false
          schema:
            type: string
          description: Filtra clientes pelo CEP
        - name: full_name
          in: query
          required: false
          schema:
            type: string
          description: Filtra clientes pelo nome completo
      responses:
        '200':
          description: Lista paginada de clientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_page:
                    type: integer
                    example: 1
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerFlat'
                  first_page_url:
                    type: string
                    example: http://localhost:8008/api/v1/customers?page=1
                  from:
                    type: integer
                    example: 1
                  last_page:
                    type: integer
                    example: 1
                  last_page_url:
                    type: string
                    example: http://localhost:8008/api/v1/customers?page=1
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          nullable: true
                        label:
                          type: string
                        active:
                          type: boolean
                  next_page_url:
                    type: string
                    nullable: true
                  path:
                    type: string
                    example: http://localhost:8008/api/v1/customers
                  per_page:
                    type: integer
                    example: 2
                  prev_page_url:
                    type: string
                    nullable: true
                  to:
                    type: integer
                    example: 1
                  total:
                    type: integer
                    example: 1
    post:
      summary: Criar cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Cliente criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /api/v1/customers/{id}:
    put:
      summary: Atualizar cliente
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID do cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '200':
          description: Cliente atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
    delete:
      summary: Deletar cliente
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID do cliente
      responses:
        '204':
          description: Cliente deletado com sucesso

components:
  schemas:
    CustomerInput:
      type: object
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        cpf:
          type: string
        phone:
          type: string
        address:
          $ref: '#/components/schemas/AddressInput'
      required:
        - full_name
        - email
        - cpf
        - phone
        - address

    AddressInput:
      type: object
      properties:
        street:
          type: string
        neighborhood:
          type: string
        number:
          type: string
        complement:
          type: string
        state:
          type: string
        city:
          type: string
        zipcode:
          type: string
      required:
        - street
        - neighborhood
        - state
        - city
        - zipcode

    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerInput'
        - type: object
          properties:
            id:
              type: integer
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            address:
              $ref: '#/components/schemas/Address'

    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          properties:
            id:
              type: integer
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    CustomerFlat:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        cpf:
          type: string
        email:
          type: string
        phone:
          type: string
        street:
          type: string
        number:
          type: string
        complement:
          type: string
        neighborhood:
          type: string
        state:
          type: string
        city:
          type: string
        zipcode:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
